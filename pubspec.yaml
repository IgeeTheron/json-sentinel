name: json_sentinel
description: Lightweight runtime JSON validation for Dart. Configurable logger, redaction, and batch validation — routes failures to any error reporter. No code generation.
version: 0.4.0
repository: https://github.com/IgeeTheron/json-sentinel
issue_tracker: https://github.com/IgeeTheron/json-sentinel/issues
documentation: https://igeetheron.github.io/json-sentinel/

topics:
  - json
  - validation
  - schema-validation
  - logging
  - observability

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
